# SET MOTOR ETHERCAT CONTROL CONFIGURE
# CONTROL MODE: [IMPEDANCE_CONTROL / CYCLIC_SYNCHORONIZE_TORQUE_CONTROL / CYCLIC_SYNCHRONIZE_POSITION_CONTROL / CYCLIC_SYNCHRONIZE_VELOCITY_CONTROL]
# A.K.A IMPEDANCE / CST / CSP / CSV

# For Impedance control : You have to set Impedance P,D Gain (Joint Space)

# motor.yaml에 둥록한 SLAVE INDEX는 "ETHERCAT의 물리적 연결 순서여야 합니다"
# 안전을 위해 CALIBRATION MODE 에서 ETHERCAT 데이지 체인으로 연결된 모터의 출력단을 움직여보셔서 연결 순서를 확인을 하신 후,
# CONTROL MODE 전 SLAVE INDEX를 다시 한번 확인해주세요.

# motor.yaml을 사용 전 아래 지시 사항을 읽어주세요 #

################################################################
# CASE 1
# PC(제어기) - 파워보드 - 모터 
# GVdrive.cpp 내의 모터 ec_slavecount는 1 부터 시작되도록 조정이 필요합니다.

# CASE 2
# PC(제어기) - 모터 직결
# GVdrive.cpp 내의 모터 ec_slavecount는 1 부터 시작되도록 조정이 필요합니다. 

# CASE 1,2는 ec_slavecount 변수가 1부터 범위가 시작되어야합니다.
# --> 2차년도 공급받은 파워보드의 경우 Ethercat MCU 칩이 없음
################################################################
# YAML에 등록될 slave_index는 '모터의 ethercat slave index' 부터 시작되어야합니다.
# motors:
#   - name: "arm_motor_1"
#     slave_index: 1
#     type: S
#     control_mode: impedance
#     p_gain: 5
#     d_gain: 1

# motors:
#   - name: "arm_motor_2"
#     slave_index: 2
#     type: S
#     control_mode: impedance
#     p_gain: 5
#     d_gain: 1

# motors:
#   - name: "arm_motor_3"
#     slave_index: 3
#     type: S
#     control_mode: impedance
#     p_gain: 5
#     d_gain: 1
################################################################
# CASE 3
# PC(제어기) - 파워보드 - 이더켓허브 - 모터 
# GVdrive.cpp 내의 모터 ec_slavecount는 3 부터 시작되도록 조정이 필요합니다.
# 2차년도 공급받은 이더켓 허브의 경우 MCU가 INDEX 1,2의 지분을 갖게 됩니다.
################################################################
# YAML에 등록될 slave_index는 '모터의 ethercat slave index' 부터 시작되어야합니다.
# motors:
#   - name: "arm_motor_1"
#     slave_index: 3
#     type: S
#     control_mode: impedance
#     p_gain: 5
#     d_gain: 1

# motors:
#   - name: "arm_motor_2"
#     slave_index: 4
#     type: S
#     control_mode: impedance
#     p_gain: 5
#     d_gain: 1

# motors:
#   - name: "arm_motor_3"
#     slave_index: 5
#     type: S
#     control_mode: impedance
#     p_gain: 5
#     d_gain: 1
###################################################################

# 실제 모터 정보 등록

# type = {S,M,HM}
# control_mode = {impedance}
# p_gain / d_gain -> impedance control에서 사용되는 joint space gain

# 하드웨어 구성 설정
# false: CASE 1, 2 (PC-파워보드-모터 또는 PC-모터 직결) -> 시작 인덱스 1
# true:  CASE 3 (PC-파워보드-이더켓허브-모터) -> 시작 인덱스 3


# Sharedmemory.hpp 에서 정의된 모터 자유도는 motors.yaml에 등록된 순서로 부여됩니다.
# GVdrive.cpp 내 load_config 함수의 push_back을 통해 부여됨

use_ethercat_hub: True 

# 20개 관절 모두 동일 모터 (type M, position 모드, p_gain 10 / d_gain 1)
# CASE 3 (허브 사용): slave 1,2 = 허브 MCU, 모터는 slave 3 ~ 22
# 실행 로그 [SCAN] slave 목록으로 slave_index ↔ 관절 대응을 반드시 확인할 것
motors:

  - name: "M1"
    joint_index: 0
    slave_index: 3
    offset: 0.0     # rad, 관절 0점 자세에서의 [START] motor 값 (관절각 = motor - offset)
    type: M
    control_mode: position
    p_gain: 10
    d_gain: 1

  - name: "M2"
    joint_index: 1
    slave_index: 4
    type: M
    control_mode: position
    p_gain: 10
    d_gain: 1

